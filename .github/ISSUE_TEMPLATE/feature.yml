name: Feature
description: Something it should do and does not.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do when you wanted this.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: How you would know it works
      description: Criteria someone else could check without asking what you meant.
